[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lrl_wiki_cls"
version = "0.0.1"
authors = [
  { name = "River Martin" },
]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "networkx",
    "mwparserfromhell",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "datasets",
    "huggingface_hub",
    "pyyaml",
]
description = "A package that cleans Wikipedia dumps to produce a dataset for text classification."
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
